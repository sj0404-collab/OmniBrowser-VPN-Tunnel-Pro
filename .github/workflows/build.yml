name: Build & Test Windows 11 WASM64 APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test WASM64 Engine, Programs, Games, Node.js, YouTube & Browser + Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit & Integration Tests (WASM64 Engine, Windows Programs, Games, Node.js, Terminal, YouTube & Browser Extensions)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Generate Release Keystore & Build Signed Release APK
        run: |
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -alias winwasm64 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass winwasm64pass \
            -keypass winwasm64pass \
            -dname "CN=WindowsWASM64, OU=Desktop, O=OpenCode, L=Kyiv, S=UA, C=UA"
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Deliverables
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Windows-WASM64-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Windows-WASM64-v1.0.0-arm64-release.apk
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-WASM64-APK
          path: dist/*.apk
          if-no-files-found: error
