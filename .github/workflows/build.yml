name: Build OmniBrowser & VPN Tunnel Pro APK (Android 5.0+)

on:
  push:
    branches: [ "android-5", "android5*", "main", "master", "v4.*" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests, API-21 Bytecode Lint & Assemble Signed Release APKs
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease --stacktrace

      - name: Verify Android 5.0 (API 21) Manifest, ABIs & v1+v2 Signatures
        run: |
          mkdir -p dist
          VER=$(grep -h -m1 -oE 'versionName *=? *"[^"]+"' app/build.gradle* | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_PART="${GITHUB_REF_NAME}"
          else
            TAG_PART="v${VER}-android5"
          fi
          echo "TAG_PART=${TAG_PART}" >> "$GITHUB_ENV"

          cp app/build/outputs/apk/release/app-universal-release.apk "dist/OmniBrowser-VPN-Tunnel-Pro-${TAG_PART}-universal-release.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "dist/OmniBrowser-VPN-Tunnel-Pro-${TAG_PART}-armeabi-v7a-release.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/OmniBrowser-VPN-Tunnel-Pro-${TAG_PART}-arm64-v8a-release.apk"

          BT_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          for apk in dist/*.apk; do
            echo "=== Inspecting $apk ==="
            "$BT_DIR/aapt2" dump badging "$apk" | grep -E "package:|sdkVersion:|targetSdkVersion:|native-code:"
            "$BT_DIR/apksigner" verify --verbose "$apk" | grep -E "Verified using"
            unzip -l "$apk" | grep -E "lib/.*\.so" || true
          done
          ls -lh dist/

      - name: Upload Universal APK (Android 5.0+, 32-bit + 64-bit ARM)
        uses: actions/upload-artifact@v4
        with:
          name: OmniBrowser-VPN-Tunnel-Pro-${{ env.TAG_PART }}-universal-release
          path: dist/OmniBrowser-VPN-Tunnel-Pro-${{ env.TAG_PART }}-universal-release.apk

      - name: Upload armeabi-v7a APK (Android 5.0+, 32-bit ARM)
        uses: actions/upload-artifact@v4
        with:
          name: OmniBrowser-VPN-Tunnel-Pro-${{ env.TAG_PART }}-armeabi-v7a-release
          path: dist/OmniBrowser-VPN-Tunnel-Pro-${{ env.TAG_PART }}-armeabi-v7a-release.apk

      - name: Upload arm64-v8a APK (Android 5.0+, 64-bit ARM)
        uses: actions/upload-artifact@v4
        with:
          name: OmniBrowser-VPN-Tunnel-Pro-${{ env.TAG_PART }}-arm64-v8a-release
          path: dist/OmniBrowser-VPN-Tunnel-Pro-${{ env.TAG_PART }}-arm64-v8a-release.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OmniBrowser VPN Tunnel Pro ${{ github.ref_name }} (Android 5.0+)
          body_path: RELEASE_NOTES.md
          files: dist/*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
