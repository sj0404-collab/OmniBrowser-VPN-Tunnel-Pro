name: Build OmniBrowser & VPN Tunnel Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Assemble Signed Release APK (R8 + Unified Keystore)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Prepare Signed APK Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/OmniBrowser-VPN-Tunnel-Pro-v4.0.2-arm64-release.apk
          ls -lh dist/
          echo "APK size (bytes): $(stat -c %s dist/OmniBrowser-VPN-Tunnel-Pro-v4.0.2-arm64-release.apk)"
          unzip -l dist/OmniBrowser-VPN-Tunnel-Pro-v4.0.2-arm64-release.apk | sort -k1 -n -r | head -n 15

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniBrowser-VPN-Tunnel-Pro-v4.0.2-arm64-release
          path: dist/OmniBrowser-VPN-Tunnel-Pro-v4.0.2-arm64-release.apk
