name: Build OmniBrowser & Torrent Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Assemble Signed Release APK (Unified Keystore)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Prepare Signed APK Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/OmniBrowser-Torrent-Pro-v2.3.0-arm64-release.apk
          ls -lh dist/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniBrowser-Torrent-Pro-v2.3.0-arm64-release
          path: dist/OmniBrowser-Torrent-Pro-v2.3.0-arm64-release.apk
